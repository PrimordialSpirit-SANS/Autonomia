# ECO-SUPPLY-2 — one-command self-host (Topology D in docs/DEPLOYMENT.md).
#
#   cp apps/gateway/.dev.vars.example .env    # fill JWT_SECRET / pepper / provider keys
#   docker compose up -d --build
#   docker compose run --rm autonomia-gateway npm run migrate   # first deploy only
#   open http://localhost:8080
#
# .env is read by the gateway service (env_file, optional so `up` works for a
# demo even before you fill secrets — the gateway fails closed without
# JWT_SECRET/pepper, which is the intended behavior, not a compose bug).

name: autonomia

services:
  autonomia-gateway:
    build:
      context: .
      target: gateway
    image: autonomia/gateway:local
    restart: unless-stopped
    environment:
      AUTONOMIA_ENABLED: "true"
      AUTONOMIA_HOST: "0.0.0.0"
      AUTONOMIA_DB_PATH: /data/autonomia.db
      # The compose nginx proxy overwrites identity headers (see
      # deploy/nginx-console.conf), so trusting it is required for
      # per-client login rate limiting instead of one shared bucket
      # (README: AUTONOMIA_TRUST_PROXY). Default true fits THIS topology
      # (gateway reachable only inside the compose network).
      # S-04: overridable from .env — when you publish 8787 directly below,
      # you MUST set AUTONOMIA_TRUST_PROXY=false in .env, otherwise every
      # request can forge its source IP (cf-connecting-ip) and the login /
      # signup rate limit collapses to one shared bucket per forged IP —
      # unlimited password brute force and signup-bonus farming.
      AUTONOMIA_TRUST_PROXY: "${AUTONOMIA_TRUST_PROXY:-true}"
      # The console is served from this compose network on port 8080.
      FRONTEND_ORIGINS: "${FRONTEND_ORIGINS:-http://localhost:8080}"
    env_file:
      - path: .env
        required: false
    volumes:
      - autonomia-data:/data
    # ⚠ S-04 WARNING: publishing 8787 directly bypasses the bundled nginx
    # proxy. If you uncomment this, the traffic reaching the gateway is NOT
    # coming from a trusted proxy — set AUTONOMIA_TRUST_PROXY=false in .env
    # or attackers forge a fresh source IP per request and defeat the login
    # rate limit entirely.
    # ports:
    #   - "8787:8787"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

  autonomia-console:
    build:
      context: .
      target: console
    image: autonomia/console:local
    restart: unless-stopped
    depends_on:
      autonomia-gateway:
        condition: service_healthy
    ports:
      - "8080:80"

volumes:
  autonomia-data:
