<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100">
  <title>Akentros</title>
  <!-- 深色圓角底板(控制台表面色 #141414,任何分頁底色都可辨識) -->
  <rect width="100" height="100" rx="18" fill="#141414"/>
  <!-- Akentros 蜂巢節點網路標誌:淺色 #ededed,同控制台原始 logo 用色 -->
  <path d="M50 14 L81.18 32 L81.18 68 L50 86 L18.82 68 L18.82 32 Z" fill="none" stroke="#ededed" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <g stroke="#ededed" stroke-width="3" stroke-linecap="round">
    <line x1="50" y1="50" x2="50" y2="14"/>
    <line x1="50" y1="50" x2="81.18" y2="32"/>
    <line x1="50" y1="50" x2="81.18" y2="68"/>
    <line x1="50" y1="50" x2="50" y2="86"/>
    <line x1="50" y1="50" x2="18.82" y2="68"/>
    <line x1="50" y1="50" x2="18.82" y2="32"/>
  </g>
  <g fill="#ededed">
    <circle cx="50" cy="14" r="6"/>
    <circle cx="81.18" cy="32" r="6"/>
    <circle cx="81.18" cy="68" r="6"/>
    <circle cx="50" cy="86" r="6"/>
    <circle cx="18.82" cy="68" r="6"/>
    <circle cx="18.82" cy="32" r="6"/>
  </g>
  <circle cx="50" cy="50" r="12" fill="#ededed"/>
</svg>