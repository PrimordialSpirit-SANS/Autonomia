# ECO-SUPPLY-2 — console reverse proxy (Topology D).
#
# SSE-safe upstream wiring: buffering off, long read timeouts, HTTP/1.1
# keep-alive. Identity headers follow the README's AUTONOMIA_TRUST_PROXY
# contract: cf-connecting-ip is OVERWRITTEN from the socket (never taken
# from the client), X-Forwarded-* appended — a proxy in front of this
# nginx must likewise overwrite, not append, cf-connecting-ip.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # S-11 fix:基本安全標頭。這是一個處理憑證的 SPA —— 沒有它們,登入頁
    # 可被 iframe 點擊劫持,且未來任何 XSS 都不受 CSP 約束。
    # - CSP:Vite bundle 皆同源(/assets);React 的 style 屬性需要
    #   style-src 'unsafe-inline'(僅樣式,不開 script)。
    # - 跨主機拓撲(console 與 api 分屬不同主機)時,connect-src 需追加閘道
    #   來源,例如 connect-src 'self' https://api.example.com。
    # - 注意 nginx 的 add_header 繼承規則:location 內一旦出現任何
    #   add_header,server 層的標頭就不再繼承 —— /assets/ 因此重複宣告。
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    location /api/ {
        proxy_pass http://autonomia-gateway:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header cf-connecting-ip $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # SSE: forward chunks as produced; never buffer a generation stream
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        # Coarse outer guard, aligned with (never tighter than) the gateway's
        # contract-tested 32MiB public body limit (AUTONOMIA_PUBLIC_BODY_MAX_BYTES):
        # oversized bodies must be rejected by the gateway's precise error path,
        # not by a raw 413 here.
        client_max_body_size 32m;
    }

    # SPA fallback for react-router routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Vite emits content-hashed assets — cache them immutably
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        # S-11:此 location 自帶 add_header,依 nginx 繼承規則需重複安全標頭。
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
        try_files $uri =404;
    }
}
