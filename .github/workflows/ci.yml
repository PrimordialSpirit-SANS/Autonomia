name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint and format check (Biome)
        run: npm run lint

      - name: Typecheck (all workspaces)
        run: npm run typecheck

      - name: Tests (all workspaces, incl. gateway)
        run: npm test

      - name: Dependency audit (high severity fails)
        run: npm audit --audit-level=high

      - name: Build console
        run: npm run build

      # ECO-SUPPLY-1 — publish-face dry-run guardrail: assemble the staged
      # artifact with the same pipeline the release workflow uses, then pin
      # the tarball shape (dist/ output present, src/ sources absent). No
      # upload happens here; a shape drift fails the build before anything
      # can ever be published.
      - name: Publish artifact sanity (stage dry-run, no upload)
        run: |
          set -euo pipefail
          npm run stage --workspace @autonomia/core
          TARBALL="$(npm pack --pack-destination "$RUNNER_TEMP" packages/core/.publish-stage | tail -n1)"
          tar -tzf "$RUNNER_TEMP/$TARBALL" > "$RUNNER_TEMP/tarball-listing.txt"
          grep -qx "package/dist/billing.js" "$RUNNER_TEMP/tarball-listing.txt" \
            || { echo "::error::staged tarball is missing dist/billing.js"; exit 1; }
          if grep -qx "package/src/billing.ts" "$RUNNER_TEMP/tarball-listing.txt"; then
            echo "::error::staged tarball leaked src/ sources"; exit 1
          fi

      # gitleaks-action@v2 requires a paid license for organization-owned
      # repositories (it can never pass here), so run the same open-source
      # gitleaks binary directly against the full history with the repo's
      # own .gitleaks.toml ruleset.
      - name: Secret scan (gitleaks)
        run: |
          set -euo pipefail
          GITLEAKS_VERSION="8.30.1"
          curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o /tmp/gitleaks.tgz
          tar -xzf /tmp/gitleaks.tgz -C /tmp gitleaks
          /tmp/gitleaks git . --redact --no-banner
